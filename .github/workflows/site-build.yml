name: "Build site"

on:
  push:
    branches:
      - master
  merge_group:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but let runs on master and in the merge queue finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  astro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-dev
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # The site renders the Nixpkgs manual from site/nixpkgs-doc, which the
      # development shell links in the same way.
      - name: Build Nixpkgs manual sources
        run: nix-build .. -A nixpkgs-doc --out-link nixpkgs-doc

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
