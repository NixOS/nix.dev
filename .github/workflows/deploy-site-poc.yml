name: "Deploy site POC"

# Every push to master (this includes merged pull requests) deploys to
# production. A manual dispatch deploys a preview, or production if requested.
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      production:
        description: "Production deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-site-poc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-dev
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # The site renders the Nixpkgs and NixOS manuals from site/nixpkgs-doc and
      # site/nixos-doc, which the development shell links in the same way.
      - name: Build Nixpkgs manual sources
        run: nix-build .. -A nixpkgs-doc --out-link nixpkgs-doc

      - name: Build NixOS manual sources
        run: nix-build .. -A nixos-doc --out-link nixos-doc

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # TODO: make this a nix-build
      - name: Build and deploy to Netlify
        run: nix run -f .. netlify-cli -- deploy --build ${PRODUCTION:+--prod} --message "$EVENT by $ACTOR @ $GITHUB_SHA"
        env:
          PRODUCTION: ${{ (github.event_name == 'push' || inputs.production) && 'true' || '' }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.PERSONAL_POC_ACCESS_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_POC_SITE_ID }}
