name: "Deploy site POC"

# MANUAL DISPATCH
on:
  workflow_dispatch:
    inputs:
      production:
        description: "Production deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-site-poc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # TOOD: make this a nix-build
      - name: Build and deploy to Netlify
        run: npx netlify deploy --build ${{ inputs.production && '--prod' || '' }} --message "workflow_dispatch by ${{ github.actor }} @ ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.PERSONAL_POC_ACCESS_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_POC_SITE_ID }}
