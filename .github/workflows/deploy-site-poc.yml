name: "Deploy site POC"

# MANUAL DISPATCH
on:
  workflow_dispatch:
    inputs:
      production:
        description: "Production deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-site-poc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-dev
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # The site renders the Nixpkgs manual from site/nixpkgs-doc, which the
      # development shell links in the same way.
      - name: Build Nixpkgs manual sources
        run: nix-build .. -A nixpkgs-doc --out-link nixpkgs-doc

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # TODO: make this a nix-build
      - name: Build and deploy to Netlify
        run: nix run -f .. netlify-cli -- deploy --build ${PRODUCTION:+--prod} --message "workflow_dispatch by $ACTOR @ $GITHUB_SHA"
        env:
          PRODUCTION: ${{ inputs.production && 'true' || '' }}
          ACTOR: ${{ github.actor }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.PERSONAL_POC_ACCESS_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_POC_SITE_ID }}
