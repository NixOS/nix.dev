name: "Test"

on:
  push:
    branches:
      - master
  merge_group:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but let runs on master and in the merge queue finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeblock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        # only used by nix-shell, to look up bashInteractive
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: nix-dev
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Run builder
      run: nix-shell --run "make dummy"
    - name: Test code blocks
      run: nix-shell --run "./run_code_block_tests.sh"
