name: "Build and Deploy"
on:
  push:
    branches:
      - master
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for the Netlify action's deploy preview comment and commit status
      pull-requests: write
      statuses: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: nix-dev
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build
      run: |
        nix-build --arg withManuals true

        # The netlify action doesn't follow symlinks properly.
        mkdir ./dist
        cp -RL ./result/* ./dist/

    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      with:
        production-deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        publish-dir: './dist'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: 'Deploy from GitHub Actions'
        enable-pull-request-comment: true
        overwrites-pull-request-comment: true
        enable-commit-comment: false
        enable-commit-status: true
        enable-github-deployment: false
      if: github.repository_owner == 'NixOS'
