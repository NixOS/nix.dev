name: Prose lint checks
on:
  push:
    branches:
      - master
  merge_group:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but let runs on master and in the merge queue finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
    - name: Vale
      run: nix run -f . vale -- maintainers source
